name: ci-golang-workflow
on: 
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
strategy:
  matrix:
    go-version: [1.16, 1.17, 1.18]
jobs:
  check-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2  # Step 1: Checkout

      - uses: actions/setup-go@v2  # Step 2: Setup Go
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests            # Step 3: Test
        run: go test

      - name: Run application      # Step 4: Run app
        run: go run math.go